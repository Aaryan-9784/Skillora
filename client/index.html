    <!-- Prevent FOUC for dark mode -->
    <script>
      try {
        const t = JSON.parse(localStorage.getItem("skillora-theme") || "{}");
        if (t.state?.isDark !== false) document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
